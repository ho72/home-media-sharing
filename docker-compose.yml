name: ouri

services:
  app:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      ORIGINALS_DIR: /data/originals
      THUMBS_DIR: /data/thumbs
      BACKUPS_DIR: /data/backups
      DATABASE_URL: file:/data/db/photoapp.sqlite
      WEB_DIST: /web
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
    volumes:
      - ./data:/data
      - ./apps/web/dist:/web:ro
    ports:
      - "${OURI_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    restart: unless-stopped
